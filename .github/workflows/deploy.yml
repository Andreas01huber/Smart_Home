# Testen und ausliefern.
#
# Ablauf bei jedem Push auf main:
#   1. GitHub prüft auf einem geliehenen Linux-Rechner Typen und Tests.
#   2. Erst wenn das grün ist, bereitet der Server zu Hause den neuen Stand
#      vor, schaltet um, prüft /health und kehrt bei einem Fehler zum
#      vorherigen Stand zurück.
#
# Der Server läuft direkt unter Windows mit Node, nicht in Docker: Die
# Maschine ist dafür zu alt. Gestartet wird über die geplante Aufgabe
# "SmartHome", die deploy/run-server.cmd ausführt.
#
# Schritt 2 braucht einen "self-hosted Runner" auf dem Windows-Server -
# ein kleines Programm, das dort auf Aufträge wartet. Einrichtung einmalig,
# Anleitung in deploy/GIT-WORKFLOW.md.

name: Test und Deploy

on:
  push:
    branches: [main]
  # Erlaubt den Deploy auch von Hand über die Actions-Oberfläche, ohne Push.
  workflow_dispatch:

# Zwei Deploys gleichzeitig würden sich beim Kopieren und beim Neustart des
# Servers in die Quere kommen. Der neuere WARTET, bis der laufende fertig ist:
# Ein Abbruch mitten im Umschalten hinterliesse sonst einen angehaltenen Server.
# (Bricht jemand von Hand ab, holt der letzte Schritt den alten Stand zurück.)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Typen und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --include=dev ist nötig: tsx und typescript stehen in devDependencies
      # und werden zum Prüfen wie zum Laufen gebraucht.
      - name: Abhängigkeiten installieren
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

  deploy:
    name: Auf den Heim-Server ausliefern
    # Ohne grüne Tests wird nichts ausgeliefert.
    needs: test
    runs-on: [self-hosted, windows]

    env:
      # Der Ordner auf dem Server, in dem die App tatsächlich läuft. Bewusst
      # NICHT der Arbeitsordner des Runners: Dort liegen weder secrets.json
      # noch die Historie, und beides darf ein Deploy nicht anfassen.
      DEPLOY_DIR: C:\SmartHome
      # Hier wird der neue Stand vorbereitet, solange der alte noch läuft.
      STAGE_DIR: C:\SmartHome-neu
      # Hier liegt der zuletzt laufende Stand, für die Rückkehr bei Fehlern.
      BACKUP_DIR: C:\SmartHome-vorher

    # Ablauf in drei Teilen:
    #   1. Vorbereiten (Server läuft weiter): Code in STAGE_DIR, neue
    #      Abhängigkeiten dort installieren und laden. Scheitert etwas, bricht
    #      der Deploy ab, und am laufenden Server hat sich nichts geändert.
    #   2. Umschalten: sichern, anhalten, kopieren, starten, /health prüfen.
    #   3. Scheitert Teil 2 oder wird der Lauf abgebrochen, kehrt der letzte
    #      Schritt zum gesicherten Stand zurück und startet ihn wieder.

    steps:
      - uses: actions/checkout@v4

      - name: Node und Autostart-Aufgabe prüfen
        shell: powershell
        run: |
          $node = (Get-Command node -ErrorAction SilentlyContinue)
          if (-not $node) {
            Write-Host '::error::Node.js ist auf dem Server nicht installiert (mindestens Version 22).'
            exit 1
          }
          $version = (node -v) -replace '^v', ''
          $gross = [int]($version -split '\.')[0]
          if ($gross -lt 22) {
            Write-Host "::error::Node $version ist zu alt - gebraucht wird 22 oder neuer."
            exit 1
          }
          Write-Host "Node $version gefunden."

          # Der Server läuft als geplante Aufgabe. Sie anzulegen braucht
          # Administratorrechte, die der Runner-Dienst nicht hat - deshalb hier
          # nur prüfen und mit klarer Ansage abbrechen.
          if (-not (Get-ScheduledTask -TaskName 'SmartHome' -ErrorAction SilentlyContinue)) {
            Write-Host '::error::Die Aufgabe "SmartHome" fehlt. Auf dem Server einmalig "Server-PC einrichten.cmd" ausfuehren.'
            exit 1
          }
          Write-Host 'Autostart-Aufgabe "SmartHome" ist eingerichtet.'

      - name: Neuen Stand vorbereiten (Server läuft weiter)
        shell: powershell
        run: |
          if (Test-Path $env:STAGE_DIR) { Remove-Item -Recurse -Force $env:STAGE_DIR }
          New-Item -ItemType Directory -Force -Path $env:STAGE_DIR | Out-Null

          $schlimmster = 0
          # Stammdateien ohne Unterordner. config.json liegt hier nur zum
          # Vergleich; ob sie auf den Server kommt, entscheidet "Umschalten".
          robocopy . $env:STAGE_DIR /LEV:1 /XF secrets.json .env /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          foreach ($ordner in @('apps', 'packages', 'tools', 'deploy', 'docs')) {
            if (-not (Test-Path ".\$ordner")) { continue }
            robocopy ".\$ordner" (Join-Path $env:STAGE_DIR $ordner) /MIR /XD node_modules dist /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          }
          if ($schlimmster -ge 8) {
            Write-Host "::error::robocopy ist mit $schlimmster fehlgeschlagen. Der laufende Server ist unveraendert."
            exit 1
          }

          # Neue Abhängigkeiten nur, wenn sich package-lock.json geändert hat.
          # Dann werden sie HIER installiert und der Server einmal zur Probe
          # geladen - ohne Netz oder mit kaputtem Paket scheitert das jetzt,
          # nicht erst nach dem Anhalten.
          $marke = Join-Path $env:DEPLOY_DIR 'node_modules\.deploy-lock-hash'
          $neu = (Get-FileHash (Join-Path $env:STAGE_DIR 'package-lock.json') -Algorithm SHA256).Hash
          $vorher = if (Test-Path $marke) { (Get-Content $marke -Raw).Trim() } else { '' }
          $tsxDa = Test-Path (Join-Path $env:DEPLOY_DIR 'node_modules\tsx')
          if ($tsxDa -and $vorher -eq $neu) {
            Write-Host 'Abhaengigkeiten unveraendert.'
            Set-Content -Path (Join-Path $env:STAGE_DIR '.abhaengigkeiten') -Value 'gleich' -Encoding ascii
            exit 0
          }

          Push-Location $env:STAGE_DIR
          npm ci --include=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::npm ci ist fehlgeschlagen (kein Internet auf dem Server?). Der laufende Server ist unveraendert.'
            exit 1
          }
          # Laden, ohne zu starten: index.ts startet nur als Hauptprogramm.
          & .\node_modules\.bin\tsx.cmd -e "import('./apps/server/src/index.ts').then(() => process.exit(0), (e) => { console.error(e); process.exit(1); })"
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::Der neue Stand laesst sich nicht laden. Der laufende Server ist unveraendert.'
            exit 1
          }
          Pop-Location
          Set-Content -Path (Join-Path $env:STAGE_DIR '.abhaengigkeiten') -Value 'neu' -Encoding ascii
          Write-Host 'Neue Abhaengigkeiten installiert und geprueft.'

      - name: Laufenden Stand sichern
        shell: powershell
        run: |
          # Nur Code und Stammdateien. data\, logs\ und secrets.json fasst der
          # Deploy ohnehin nicht an, sie brauchen keine Sicherung.
          New-Item -ItemType Directory -Force -Path $env:BACKUP_DIR | Out-Null
          $schlimmster = 0
          robocopy $env:DEPLOY_DIR $env:BACKUP_DIR /LEV:1 /XF secrets.json .env /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          foreach ($ordner in @('apps', 'packages', 'tools', 'deploy', 'docs')) {
            $quelle = Join-Path $env:DEPLOY_DIR $ordner
            if (-not (Test-Path $quelle)) { continue }
            robocopy $quelle (Join-Path $env:BACKUP_DIR $ordner) /MIR /XD node_modules dist /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          }
          if ($schlimmster -ge 8) {
            Write-Host "::error::Sicherung fehlgeschlagen (robocopy $schlimmster). Ohne Sicherung wird nicht umgeschaltet."
            exit 1
          }
          Write-Host "Laufender Stand gesichert nach $env:BACKUP_DIR."

      - name: Server anhalten
        shell: powershell
        run: |
          # Ab hier ist der Server unten. Die Marke sagt dem letzten Schritt,
          # dass er bei einem Fehler oder Abbruch zurückkehren muss.
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'smarthome-angehalten') -Value '1' -Encoding ascii

          # Fehler beim Anhalten werden hier bewusst eingesammelt statt
          # verschluckt: Scheitert das Anhalten an fehlenden Rechten, muss die
          # Meldung sagen, woran es wirklich lag.
          $rechteproblem = $false

          try {
            Stop-ScheduledTask -TaskName 'SmartHome' -ErrorAction Stop
            Write-Host 'Aufgabe "SmartHome" angehalten.'
          } catch {
            Write-Host "Aufgabe liess sich nicht anhalten: $($_.Exception.Message)"
            if ($_.Exception.Message -match 'denied|verweigert|Zugriff') { $rechteproblem = $true }
          }

          # Die Aufgabe startet run-server.cmd, das seinerseits Node startet.
          # Wird die Aufgabe beendet, überlebt der Node-Prozess das und hält
          # den Port weiter besetzt. Also gezielt den freimachen, der auf 4173
          # hört. Verloren gehen dabei höchstens die Energiewerte seit dem
          # letzten automatischen Sichern (alle zwei Minuten).
          foreach ($v in Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue) {
            try {
              Stop-Process -Id $v.OwningProcess -Force -ErrorAction Stop
            } catch {
              Write-Host "Prozess $($v.OwningProcess) liess sich nicht beenden: $($_.Exception.Message)"
              $rechteproblem = $true
            }
          }

          foreach ($i in 1..20) {
            if (-not (Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue)) {
              Write-Host 'Port 4173 ist frei.'
              exit 0
            }
            Start-Sleep -Seconds 1
          }

          if ($rechteproblem) {
            Write-Host '::error::Der Runner darf den laufenden Server nicht beenden. Behebung: auf dem Server "Runner reparieren.cmd" als Administrator ausfuehren.'
          } else {
            Write-Host '::error::Port 4173 ist nach 20 Sekunden noch belegt.'
          }
          exit 1

      - name: Umschalten
        shell: powershell
        run: |
          $schlimmster = 0
          robocopy $env:STAGE_DIR $env:DEPLOY_DIR /LEV:1 /XF secrets.json .env config.json .abhaengigkeiten /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          foreach ($ordner in @('apps', 'packages', 'tools', 'deploy', 'docs')) {
            $quelle = Join-Path $env:STAGE_DIR $ordner
            if (-not (Test-Path $quelle)) { continue }
            robocopy $quelle (Join-Path $env:DEPLOY_DIR $ordner) /MIR /XD node_modules dist /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          }
          if ($schlimmster -ge 8) {
            Write-Host "::error::robocopy ist mit $schlimmster fehlgeschlagen."
            exit 1
          }

          # config.json: Die Anlagenkonfiguration auf dem Server wird nicht
          # durch die Fassung aus dem Repository ersetzt. Nur beim allerersten
          # Deploy kommt sie mit. Weicht sie ab, liegt die Repo-Fassung als
          # config.repo.json daneben, und der Lauf sagt es.
          $ziel = Join-Path $env:DEPLOY_DIR 'config.json'
          if (-not (Test-Path $ziel)) {
            Copy-Item 'config.json' $ziel
            Write-Host 'config.json erstmals angelegt.'
          } elseif ((Get-FileHash 'config.json').Hash -ne (Get-FileHash $ziel).Hash) {
            Copy-Item 'config.json' (Join-Path $env:DEPLOY_DIR 'config.repo.json') -Force
            Write-Host '::warning::config.json im Repository weicht von der auf dem Server ab. Die Server-Fassung bleibt; die Repo-Fassung liegt als config.repo.json daneben.'
          }

          $abh = (Get-Content (Join-Path $env:STAGE_DIR '.abhaengigkeiten') -Raw).Trim()
          if ($abh -eq 'neu') {
            # Pakete liegen nach der Vorbereitung im npm-Cache; das hier
            # braucht kein Netz mehr.
            Push-Location $env:DEPLOY_DIR
            npm ci --include=dev --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::npm ci im Deploy-Ordner fehlgeschlagen.'; exit 1 }
            $hash = (Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash
            Set-Content -Path 'node_modules\.deploy-lock-hash' -Value $hash -Encoding ascii
            Pop-Location
          }

          # Ohne diese Datei laesst sich auf dem Server nicht feststellen, welcher
          # Stand dort eigentlich liegt. "Server pruefen.cmd" liest sie aus.
          $zeilen = @(
            "Stand      : $env:GITHUB_SHA",
            "Ausgeliefert: $(Get-Date -Format 'dd.MM.yyyy HH:mm:ss')",
            "Workflow   : $env:GITHUB_RUN_NUMBER ($env:GITHUB_REF_NAME)"
          )
          Set-Content -Path (Join-Path $env:DEPLOY_DIR 'VERSION.txt') -Value $zeilen -Encoding ascii
          $zeilen | ForEach-Object { Write-Host $_ }

      - name: Starten und prüfen
        shell: powershell
        run: |
          Start-ScheduledTask -TaskName 'SmartHome'
          # /health braucht keine Anmeldung und sagt, ob die Messung läuft.
          # Der erste Start dauert länger, weil tsx den Code übersetzt.
          $ok = $false
          foreach ($i in 1..45) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/health' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            Write-Host '::error::Der neue Stand meldet sich nach 90 Sekunden nicht gesund.'
            $log = Join-Path $env:DEPLOY_DIR 'logs\server.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            exit 1
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'smarthome-angehalten') -Force
          Write-Host 'Der Server antwortet auf Port 4173.'
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } |
            ForEach-Object { '   http://' + $_.IPAddress + ':4173' }

      - name: Bei Fehler oder Abbruch zum alten Stand zurück
        # Läuft auch nach einem Abbruch. Ohne die Marke aus "Server anhalten"
        # war der Server nie unten, dann gibt es nichts zu tun.
        if: failure() || cancelled()
        shell: powershell
        run: |
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'smarthome-angehalten'))) {
            Write-Host 'Der Server wurde nicht angehalten - nichts zurueckzunehmen.'
            exit 0
          }
          Write-Host 'Kehre zum gesicherten Stand zurueck.'
          try { Stop-ScheduledTask -TaskName 'SmartHome' -ErrorAction Stop } catch { }
          foreach ($v in Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue) {
            try { Stop-Process -Id $v.OwningProcess -Force -ErrorAction Stop } catch { }
          }
          Start-Sleep -Seconds 2

          robocopy $env:BACKUP_DIR $env:DEPLOY_DIR /LEV:1 /XF secrets.json .env config.json /NFL /NDL /NJH /NJS /NP | Out-Null
          foreach ($ordner in @('apps', 'packages', 'tools', 'deploy', 'docs')) {
            $quelle = Join-Path $env:BACKUP_DIR $ordner
            if (-not (Test-Path $quelle)) { continue }
            robocopy $quelle (Join-Path $env:DEPLOY_DIR $ordner) /MIR /XD node_modules dist /NFL /NDL /NJH /NJS /NP | Out-Null
          }

          # Passten die installierten Abhängigkeiten nicht mehr zum alten
          # package-lock.json, jetzt zurückinstallieren (aus dem Cache).
          Push-Location $env:DEPLOY_DIR
          $marke = 'node_modules\.deploy-lock-hash'
          $soll = (Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash
          $ist = if (Test-Path $marke) { (Get-Content $marke -Raw).Trim() } else { '' }
          if ($ist -ne $soll) {
            npm ci --include=dev --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -eq 0) { Set-Content -Path $marke -Value $soll -Encoding ascii }
          }
          Pop-Location

          Start-ScheduledTask -TaskName 'SmartHome'
          foreach ($i in 1..45) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/health' -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) {
                Write-Host '::warning::Der Deploy ist gescheitert; der vorherige Stand laeuft wieder.'
                exit 1
              }
            } catch { }
            Start-Sleep -Seconds 2
          }
          Write-Host '::error::Auch der vorherige Stand meldet sich nicht gesund. Bitte auf dem Server "Server pruefen.cmd" ausfuehren.'
          exit 1
