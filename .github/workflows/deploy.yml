# Testen und ausliefern.
#
# Ablauf bei jedem Push auf main:
#   1. GitHub prüft auf einem geliehenen Linux-Rechner Typen und Tests.
#   2. Erst wenn das grün ist, holt der Server zu Hause den neuen Stand und
#      startet den Dienst neu.
#
# Der Server läuft direkt unter Windows mit Node, nicht in Docker: Die
# Maschine ist dafür zu alt. Gestartet wird über die geplante Aufgabe
# "SmartHome", die deploy/run-server.cmd ausführt.
#
# Schritt 2 braucht einen "self-hosted Runner" auf dem Windows-Server -
# ein kleines Programm, das dort auf Aufträge wartet. Einrichtung einmalig,
# Anleitung in deploy/GIT-WORKFLOW.md.

name: Test und Deploy

on:
  push:
    branches: [main]
  # Erlaubt den Deploy auch von Hand über die Actions-Oberfläche, ohne Push.
  workflow_dispatch:

# Zwei Deploys gleichzeitig würden sich beim Kopieren und beim Neustart des
# Servers in die Quere kommen. Der neuere gewinnt, der ältere wird abgebrochen.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    name: Typen und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --include=dev ist nötig: tsx und typescript stehen in devDependencies
      # und werden zum Prüfen wie zum Laufen gebraucht.
      - name: Abhängigkeiten installieren
        run: npm ci --include=dev --no-audit --no-fund

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests
        run: npm test

  deploy:
    name: Auf den Heim-Server ausliefern
    # Ohne grüne Tests wird nichts ausgeliefert.
    needs: test
    runs-on: [self-hosted, windows]

    env:
      # Der Ordner auf dem Server, in dem die App tatsächlich läuft. Bewusst
      # NICHT der Arbeitsordner des Runners: Dort liegen weder secrets.json
      # noch die Historie, und beides darf ein Deploy nicht anfassen.
      DEPLOY_DIR: C:\SmartHome

    steps:
      - uses: actions/checkout@v4

      - name: Node und Autostart-Aufgabe prüfen
        shell: powershell
        run: |
          $node = (Get-Command node -ErrorAction SilentlyContinue)
          if (-not $node) {
            Write-Host '::error::Node.js ist auf dem Server nicht installiert (mindestens Version 22).'
            exit 1
          }
          $version = (node -v) -replace '^v', ''
          $gross = [int]($version -split '\.')[0]
          if ($gross -lt 22) {
            Write-Host "::error::Node $version ist zu alt - gebraucht wird 22 oder neuer."
            exit 1
          }
          Write-Host "Node $version gefunden."

          # Der Server läuft als geplante Aufgabe. Sie anzulegen braucht
          # Administratorrechte, die der Runner-Dienst nicht hat - deshalb hier
          # nur prüfen und mit klarer Ansage abbrechen.
          if (-not (Get-ScheduledTask -TaskName 'SmartHome' -ErrorAction SilentlyContinue)) {
            Write-Host '::error::Die Aufgabe "SmartHome" fehlt. Auf dem Server einmalig "Server-PC einrichten.cmd" ausfuehren.'
            exit 1
          }
          Write-Host 'Autostart-Aufgabe "SmartHome" ist eingerichtet.'

      - name: Server anhalten
        shell: powershell
        run: |
          Stop-ScheduledTask -TaskName 'SmartHome' -ErrorAction SilentlyContinue

          # Die Aufgabe startet run-server.cmd, das seinerseits Node startet.
          # Wird die Aufgabe beendet, überlebt der Node-Prozess das und hält
          # den Port weiter besetzt. Also gezielt den freimachen, der auf 4173
          # hört.
          #
          # Das ist ein harter Abbruch ohne sauberes Herunterfahren. Verloren
          # gehen dabei höchstens die Energiewerte seit dem letzten
          # automatischen Sichern - die Historie schreibt sich alle zwei
          # Minuten selbst weg.
          foreach ($v in Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue) {
            Stop-Process -Id $v.OwningProcess -Force -ErrorAction SilentlyContinue
          }

          # Erst weitermachen, wenn der Port wirklich frei ist - sonst kann der
          # neue Server nicht binden und der Deploy scheitert erst ganz hinten.
          foreach ($i in 1..20) {
            if (-not (Get-NetTCPConnection -LocalPort 4173 -State Listen -ErrorAction SilentlyContinue)) {
              Write-Host 'Port 4173 ist frei.'
              exit 0
            }
            Start-Sleep -Seconds 1
          }
          Write-Host '::error::Port 4173 ist nach 20 Sekunden noch belegt.'
          exit 1

      - name: Code in den Deploy-Ordner übertragen
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:DEPLOY_DIR | Out-Null

          $schlimmster = 0

          # Durchgang 1: die Dateien im Projektstamm - ohne Unterordner (/LEV:1)
          # und ohne Löschen. Im Stamm liegen data\ und secrets.json, die dem
          # Server gehören und die ein Deploy niemals anfassen darf.
          robocopy . $env:DEPLOY_DIR /LEV:1 /XF secrets.json .env /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }

          # Durchgang 2: die Ordner mit Code und Doku - als Spiegel (/MIR). Nur
          # so verschwindet auf dem Server auch das, was im Repository gelöscht
          # oder umbenannt wurde. Ohne Spiegel bliebe die alte Datei liegen und
          # würde weiter ausgeliefert - beim Umbenennen lägen beide Fassungen da.
          #
          # Dass hier gelöscht werden darf, ist ungefährlich: data\ und
          # secrets.json liegen im Stamm und damit außerhalb dieser Bäume. Das
          # ist keine Frage der richtigen Ausschluss-Schalter mehr, sondern eine
          # des Aufbaus - und deshalb nicht kaputtzukonfigurieren.
          foreach ($ordner in @('apps', 'packages', 'tools', 'deploy', 'docs')) {
            if (-not (Test-Path ".\$ordner")) { continue }
            $ziel = Join-Path $env:DEPLOY_DIR $ordner
            robocopy ".\$ordner" $ziel /MIR /XD node_modules dist /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -gt $schlimmster) { $schlimmster = $LASTEXITCODE }
          }

          # robocopy meldet Erfolg mit 0-7, erst ab 8 ist es ein Fehler.
          if ($schlimmster -ge 8) {
            Write-Host "::error::robocopy ist mit $schlimmster fehlgeschlagen."
            exit 1
          }
          Write-Host "Uebertragen. Hoechster robocopy-Status: $schlimmster (unter 8 = ok)."
          exit 0

      - name: Zugangsdaten vorhanden?
        shell: powershell
        run: |
          $secrets = Join-Path $env:DEPLOY_DIR 'secrets.json'
          if (-not (Test-Path $secrets)) {
            # Kein Abbruch: Alles außer der Wallbox läuft auch ohne sie.
            Write-Host "::warning::secrets.json fehlt in $env:DEPLOY_DIR - die Wallbox bleibt leer."
          }

      - name: Abhängigkeiten aktualisieren
        shell: powershell
        working-directory: C:\SmartHome
        run: |
          # npm ci bei jedem Deploy wäre Verschwendung und würde ohne Internet
          # scheitern, obwohl sich gar nichts geändert hat. Deshalb nur dann,
          # wenn node_modules fehlt oder package-lock.json sich geändert hat -
          # gemerkt an einer Prüfsumme neben den Abhängigkeiten.
          $marke = 'node_modules\.deploy-lock-hash'
          $jetzt = (Get-FileHash 'package-lock.json' -Algorithm SHA256).Hash
          $vorher = if (Test-Path $marke) { Get-Content $marke -Raw } else { '' }

          if ((Test-Path 'node_modules\tsx') -and $vorher.Trim() -eq $jetzt) {
            Write-Host 'Abhaengigkeiten unveraendert - uebersprungen.'
            exit 0
          }

          # --include=dev ist nötig: tsx steht in devDependencies, wird aber
          # zum Laufen gebraucht - der Server läuft aus den TypeScript-Quellen.
          npm ci --include=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::npm ci ist fehlgeschlagen (kein Internet auf dem Server?).'
            exit 1
          }
          Set-Content -Path $marke -Value $jetzt -Encoding ascii
          Write-Host 'Abhaengigkeiten neu installiert.'

      - name: Server starten
        shell: powershell
        run: |
          Start-ScheduledTask -TaskName 'SmartHome'
          Write-Host 'Aufgabe "SmartHome" gestartet.'

      - name: Läuft er wirklich?
        shell: powershell
        run: |
          # Nicht auf "gestartet" vertrauen, sondern nachsehen. Der erste Start
          # dauert länger, weil tsx den Code einmal übersetzt - deshalb bis zu
          # 90 Sekunden.
          $ok = $false
          foreach ($i in 1..45) {
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:4173/api/snapshot' `
                     -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }

          $log = Join-Path $env:DEPLOY_DIR 'logs\server.log'

          if (-not $ok) {
            Write-Host '::error::Der Server antwortet nach 90 Sekunden nicht.'
            if (Test-Path $log) {
              Write-Host '--- letzte 60 Zeilen aus logs\server.log ---'
              Get-Content $log -Tail 60
            } else {
              Write-Host "Keine Logdatei unter $log - die Aufgabe ist vermutlich gar nicht angelaufen."
              Get-ScheduledTask -TaskName 'SmartHome' | Get-ScheduledTaskInfo
            }
            exit 1
          }

          Write-Host 'Der Server antwortet auf Port 4173.'
          # Die Adressen, unter denen das Dashboard jetzt erreichbar ist -
          # praktisch, wenn sich die IP des Servers einmal geändert hat.
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } |
            ForEach-Object { '   http://' + $_.IPAddress + ':4173' }
